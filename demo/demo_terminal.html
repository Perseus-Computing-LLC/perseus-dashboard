<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perseus Dashboard — H0 Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  #screen {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 10px;
    width: 1150px;
    height: 380px;
    overflow-y: auto;
    padding: 20px 28px;
    font-size: 13px;
    line-height: 1.6;
    scroll-behavior: smooth;
  }
  .line { margin: 2px 0; white-space: pre-wrap; word-break: break-all; }
  .user { color: #5c7cfa; }
  .agent { color: #3fb950; }
  .system { color: #d2991d; }
  .dim { color: #8b949e; }
  .highlight { color: #ff7b72; }
  .badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 11px;
    margin-right: 2px;
  }
  .badge-store { background: rgba(63,185,80,0.15); color: #3fb950; }
  .badge-recall { background: rgba(92,124,250,0.15); color: #5c7cfa; }
  .badge-insight { background: rgba(210,153,29,0.15); color: #d2991d; }
  .badge-decay { background: rgba(248,81,73,0.15); color: #f85149; }
  .title { font-size: 16px; font-weight: bold; color: #5c7cfa; }
  .subtitle { font-size: 12px; color: #8b949e; }
</style>
</head>
<body>
<div id="screen"></div>
<script>
const screen = document.getElementById('screen');
const lines = [];

function addLine(text, cls = '') {
  const div = document.createElement('div');
  div.className = 'line ' + cls;
  div.innerHTML = text;
  screen.appendChild(div);
  screen.scrollTo({ top: screen.scrollHeight, behavior: 'smooth' });
}

function pause(ms) {
  return new Promise(r => setTimeout(r, ms));
}

async function run() {
  // === SCENE 1: The Problem (0:00-0:30) ===
  addLine('<span class="title">╔════════════════════════════════════════╗</span>');
  addLine('<span class="title">║  PERSEUS DASHBOARD — H0 HACKATHON DEMO ║</span>');
  addLine('<span class="title">╚════════════════════════════════════════╝</span>');
  addLine('');
  addLine('<span class="dim">─── SCENE 1: THE PROBLEM ───</span>');
  await pause(1500);
  addLine('');
  addLine('<span class="user">▸ developer:</span> Let me ask my AI assistant about our services...');
  await pause(1200);
  addLine('<span class="agent">● claude-code:</span> Let me check what\'s running...');
  await pause(600);
  addLine('<span class="agent">● claude-code:</span> <span class="dim">[running: docker ps]</span>');
  addLine('<span class="agent">● claude-code:</span> <span class="dim">[reading: .env]</span>');
  addLine('<span class="agent">● claude-code:</span> <span class="dim">[checking: CI status]</span>');
  await pause(1000);
  addLine('<span class="highlight">⚠ Discovery overhead is illustrative; token count unavailable without paired raw sessions.</span>');
  await pause(1500);
  addLine('');
  addLine('<span class="dim">Every AI coding session starts COLD. Agents rediscover your environment</span>');
  addLine('<span class="dim">from scratch — burning tokens and turns on questions you already know.</span>');
  await pause(2500);

  // === SCENE 2: The Solution (0:30-1:10) ===
  addLine('');
  addLine('<span class="dim">─── SCENE 2: THE SOLUTION ───</span>');
  await pause(1000);
  addLine('');
  addLine('<span class="user">▸ Perseus Dashboard:</span> <span class="badge badge-store">SYNTHETIC</span> Source-labeled context fixture.');
  await pause(1500);
  addLine('');
  addLine('<span class="dim">── Synthetic Service Fixture ──</span>');
  addLine('  <span class="agent">● CI (GitHub Actions)  </span> <span class="badge badge-store">FIXTURE</span> latency unavailable');
  addLine('  <span class="agent">● PostgreSQL (Aurora)  </span> <span class="badge badge-store">FIXTURE</span> latency unavailable');
  addLine('  <span class="agent">● Redis Cache           </span> <span class="badge badge-store">FIXTURE</span> latency unavailable');
  addLine('  <span class="agent">● API Gateway           </span> <span class="badge badge-store">FIXTURE</span> latency unavailable');
  addLine('  <span class="agent">● Docker Registry       </span> <span class="badge badge-store">FIXTURE</span> latency unavailable');
  await pause(2000);
  addLine('');
  addLine('<span class="dim">── Context Snapshot (what the agent will see) ──</span>');
  addLine('  <span class="user">📄 AGENTS.md</span> <span class="dim">— last modified 2h ago</span>');
  addLine('  <span class="user">📄 pyproject.toml</span> <span class="dim">— deps: pyyaml, fastapi, psycopg2</span>');
  addLine('  <span class="user">📄 docker-compose.yml</span> <span class="dim">— 3 containers running</span>');
  addLine('');
  addLine('<span class="system">◆ Token estimate: unavailable — no paired raw session artifact.</span>');
  await pause(2500);

  // === SCENE 3: Memory Feed (1:10-1:50) ===
  addLine('');
  addLine('<span class="dim">─── SCENE 3: MEMORY FEED (synthetic fixture) ───</span>');
  await pause(1500);
  addLine('');
  addLine('<span class="badge badge-store">STORE</span> <span class="dim">14:32:05</span>  <span class="agent">database.postgres_version</span> → PostgreSQL 16.3 on Aurora  <span class="dim">95%</span>');
  await pause(800);
  addLine('<span class="badge badge-recall">RECALL</span> <span class="dim">14:32:10</span>  <span class="agent">convention.python_formatter</span> → black --line-length 88  <span class="dim">92%</span>');
  await pause(800);
  addLine('<span class="badge badge-insight">INSIGHT</span> <span class="dim">14:32:22</span>  <span class="agent">pattern.api_structure</span> → FastAPI /api/{resource}/{id}/action  <span class="dim">88%</span>');
  await pause(800);
  addLine('<span class="badge badge-store">STORE</span> <span class="dim">14:32:35</span>  <span class="agent">config.ci_provider</span> → GitHub Actions with matrix build  <span class="dim">90%</span>');
  await pause(800);
  addLine('<span class="badge badge-decay">DECAY</span> <span class="dim">14:32:48</span>  <span class="agent">preference.old_editor</span> → vscode (switched to cursor)  <span class="dim">15%</span>');
  await pause(1500);
  addLine('');
  addLine('<span class="system">◆ Synthetic memory fixture rendered — no live database write is claimed.</span>');
  await pause(2500);

  // === SCENE 4: The Stack (1:50-2:25) ===
  addLine('');
  addLine('<span class="dim">─── SCENE 4: THE STACK (H0 Requirements) ───</span>');
  await pause(1500);
  addLine('');
  addLine('<span class="user">▲ Vercel v0 Frontend</span> <span class="dim">— Next.js 14 + Tailwind CSS</span>');
  addLine('  <span class="dim">│  Dashboard | Service Cards | Context Panel | Memory Feed | Unavailable metrics</span>');
  addLine('  <span class="dim">│</span>');
  addLine('<span class="agent">🐍 FastAPI Backend</span> <span class="dim">— Python · source-labeled fixture routes</span>');
  addLine('  <span class="dim">│  /api/projects | /api/context | /api/memories | /api/analytics</span>');
  addLine('  <span class="dim">│</span>');
  addLine('<span class="system">☁️ AWS Aurora PostgreSQL</span> <span class="dim">— planned production target</span>');
  addLine('  <span class="dim">│  schema target | no live connection in this fixture build</span>');
  addLine('  <span class="dim">│</span>');
  addLine('<span class="highlight">🪞 Perseus Context Engine</span> <span class="dim">— planned evidence-producing integration</span>');
  await pause(3000);

  // === SCENE 5: Impact & CTA (2:25-2:55) ===
  addLine('');
  addLine('<span class="dim">─── SCENE 5: THE IMPACT ───</span>');
  await pause(1500);
  addLine('');
  addLine('<span class="system">◆ Token Savings This Week</span>');
  addLine('  <span class="agent">Unavailable — no paired measured before/after sessions</span>');
  await pause(2500);
  addLine('');
  addLine('<span class="dim">── Token savings are not claimed until a hash-bound paired-session artifact exists. ──</span>');
  await pause(1500);
  addLine('');
  addLine('<span class="title">╔════════════════════════════════════════╗</span>');
  addLine('<span class="title">║  Perseus Dashboard                    ║</span>');
  addLine('<span class="title">║  github.com/Perseus-Computing-LLC/perseus-dashboard ║</span>');
  addLine('<span class="title">║  H0: Hack the Zero Stack · Open Innovation ║</span>');
  addLine('<span class="title">║  Vercel v0 + AWS Aurora PostgreSQL    ║</span>');
  addLine('<span class="title">╚════════════════════════════════════════╝</span>');
}

run();
</script>
</body>
</html>
